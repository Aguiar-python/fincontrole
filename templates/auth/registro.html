{% extends "base.html" %}
{% block titulo %}Criar conta — FinControle{% endblock %}

{% block conteudo_auth %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><i data-lucide="wallet"></i> FinControle</div>
    <p class="auth-sub">Crie sua conta para começar a organizar suas finanças.</p>
    <form method="post">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required autofocus>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>
    <p class="auth-switch">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
