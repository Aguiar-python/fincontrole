{% extends "base.html" %}
{% block titulo %}Entrar — FinControle{% endblock %}

{% block conteudo_auth %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><i data-lucide="wallet"></i> FinControle</div>
    <p class="auth-sub">Controle seus cartões e despesas mensais em um só lugar.</p>
    <form method="post">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p class="auth-switch">Ainda não tem conta? <a href="{{ url_for('auth.registro') }}">Criar conta</a></p>
  </div>
</div>
{% endblock %}
